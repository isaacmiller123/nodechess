name: build

# Builds the desktop app for macOS and Windows.
#
# Triggers:
#   - workflow_dispatch: a manual run from the Actions tab (any branch).
#   - push of a v* tag, e.g. `git tag v0.1.0 && git push origin v0.1.0`.
#
# Each matrix leg runs on its own OS (electron-builder cannot cross-compile the
# native installers), installs deps, typechecks, builds the renderer/main bundles,
# then packages with electron-builder for THAT platform only. electron-builder
# itself publishes nothing (`--publish never`): every run uploads the installers as
# workflow artifacts, and a v* tag run additionally attaches them to the matching
# GitHub Release with `gh` (last step). A workflow_dispatch run stops at artifacts.
#
# No code signing: the mac build is unsigned (electron-builder.yml sets identity:
# null) and the win build is unsigned too. Users clear Gatekeeper / SmartScreen
# manually on first run. See the README "unsigned build" caveats.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# Let a newer run for the same ref cancel an in-flight one.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# `contents: write` lets the tag build attach the installers to a GitHub Release.
permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One failing OS should not abort the other. You still get the build that
      # did succeed as an artifact.
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # 26 is the floor package.json `engines` declares: the DB-backed suites
          # (test-settings-persist, test-games-archive, test-ratings-integrity)
          # import node:sqlite, which Node 22 gates behind --experimental-sqlite.
          node-version: "26"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build (renderer + main)
        run: npm run build

      # Cross-platform congruence gate: the pure-node game/platform/accounts suites
      # run on BOTH OS legs (they need no engine binaries and no display, just
      # headless esbuild bundles). scripts/run-suites.mjs globs scripts/test-*.mjs
      # rather than repeating a stem list here, so a new suite is covered the day it
      # lands; its in-file deny-list holds the exclusions and the reason for each
      # (engine-binary probes stay local-only, the test-web-* set belongs to
      # .github/workflows/web.yml). Reproduce a red leg locally with `npm test`, or
      # one suite with `node scripts/run-suites.mjs --only=<substring>`.
      - name: Game & platform suites
        # Skippable for a fast release when the suites already passed on the other
        # leg: put [skip-tests] in the tagged commit message. Packaging/publish
        # still run. Every other run (manual dispatch, or a tag without the
        # marker) runs the full wall.
        if: ${{ !contains(github.event.head_commit.message, '[skip-tests]') }}
        shell: bash
        run: npm test

      # Package for the current OS only. electron-builder auto-selects the win/mac
      # target block from electron-builder.yml based on the runner. --publish never
      # keeps it from touching any GitHub release. The datasets (engine + puzzle DB)
      # are NOT bundled (they import at runtime), so no large downloads happen here.
      - name: Package (electron-builder)
        run: npx electron-builder --publish never
        env:
          # Belt-and-suspenders: prevent electron-builder from attempting any
          # code-signing/notarization on either OS in CI (builds stay unsigned).
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      # Upload only the distributable artifacts, not the unpacked app trees. The
      # globs cover: Windows nodechess-Setup-*.exe / nodechess-Portable-*.exe / nodechess-*.zip
      # and macOS nodechess-*.dmg / nodechess-*.zip, plus the build metadata files.
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nodechess-${{ matrix.os }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest*.yml

      # Tag builds also publish the installers as GitHub Release assets. That is
      # the public download page. Both matrix legs race to create the release; the
      # loser's create fails harmlessly (|| true) and both then upload their own
      # platform's files (--clobber makes re-runs idempotent). `gh` is
      # preinstalled on all runners; the ambient GITHUB_TOKEN has contents:write
      # (see permissions above). Besides the installers/zips, the update feed
      # files MUST be attached too: latest.yml + *.blockmap (win leg) feed
      # electron-updater's in-place Windows auto-update, and latest-mac.yml (mac
      # leg) is harmless metadata kept for symmetry. The mac app checks the
      # releases API instead (unsigned build, see src/main/updates).
      - name: Publish installers to the GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<'EOF'
          Offline board-game studio for Windows & macOS.

          - **Chess**: Stockfish analysis with chess.com-style game review, a 0→2000 School (coach Viktor), ~4.7M Lichess puzzles, 24 famous-player bots, and human-like Maia opponents.
          - **Online multiplayer**: worldwide peer-to-peer. Host, share a code, play anyone anywhere. No account, no port forwarding.
          - **20+ games**: chess variants, xiangqi, shogi, janggi, makruk, go, checkers, othello, connect four, gomoku, hex, morris. Each one plays local, vs a bot, or online, with 2D & 3D boards. Plus a custom-variant Lab.

          **Windows:** `nodechess-Setup-*.exe` (installer) or `nodechess-Portable-*.exe` (no install).
          **macOS:** the `.dmg` for your chip (arm64 = Apple Silicon, x64 = Intel).

          Both players must run the same version for online play. The app checks for updates on launch (Windows updates itself; macOS offers the new `.dmg` to install over the old app). Builds are unsigned: Windows SmartScreen → More info → Run anyway; macOS → right-click the app → Open (first launch only). On first run, use Settings → Datasets to import the engine and puzzle database.
          EOF
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "nodechess $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" \
            2>/dev/null || true
          files=$(ls release/*.exe release/*.dmg release/*.zip release/*.blockmap release/latest*.yml 2>/dev/null || true)
          [ -n "$files" ] && gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber $files
