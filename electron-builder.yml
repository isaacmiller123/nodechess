appId: org.nodechess.app
productName: nodechess
directories:
  output: release
# Update feed (src/main/updates). Declaring the GitHub provider makes
# electron-builder emit latest.yml / latest-mac.yml (+ *.blockmap) into release/
# and bake app-update.yml into the packaged app so electron-updater knows where
# the feed lives. Nothing publishes from here. CI packages with --publish never
# and attaches the files to the GitHub Release itself. Windows auto-updates in
# place off this feed (unsigned NSIS works). macOS can NOT, because Squirrel.Mac
# refuses unsigned bundles. The mac path is check + notify + browser download of
# the right dmg (see src/main/updates/updateLogic.ts).
publish:
  provider: github
  owner: isaacmiller123
  repo: nodechess
asar: true
files:
  - "out/**"
extraResources:
  # Lean installer: the heavy datasets (Stockfish engine ~114 MB and the ~2 GB
  # puzzles.sqlite) are NOT bundled. They are imported at runtime from the public
  # GitHub release via Settings -> Datasets (see src/main/datasets), keeping the
  # repo and installer small. Only the tiny, always-on content is bundled below.
  - from: "resources/openings"
    to: "openings"
  - from: "resources/famous"
    to: "famous"
  - from: "resources/curriculum"
    to: "curriculum"
  - from: "resources/personas"
    to: "personas"
  # Games platform art (piece SVGs + CC0 PBR board textures, ~14 MB; see
  # docs/CREDITS.md). The renderer resolves file:// URLs into this copy via
  # src/renderer/src/games/art.ts.
  - from: "resources/games-art"
    to: "games-art"
win:
  # x64 only: matches the published stockfish-sf18-win-x64 engine artifact and the
  # existing releases. Three artifacts: the NSIS installer, a single-file portable
  # .exe, and a portable .zip (all built on windows-latest in CI). Explicit arch so
  # the build never silently emits an ia32/arm64 binary the engine has no match for.
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
    - target: zip
      arch:
        - x64
  icon: build/icon.ico
  # Fallback for targets without their own block (the win zip): os+arch so the
  # per-platform zips never collide.
  artifactName: nodechess-${version}-${os}-${arch}.${ext}
mac:
  # Same lean model as Windows: the engine + puzzle DB are imported at runtime,
  # not bundled, so the .dmg/.zip stay small. arm64 (Apple Silicon) + x64 (Intel).
  # Exception: Fairy-Stockfish (~750 KB, the games-platform variant-bot engine)
  # IS bundled. It is tiny, always-on, and has no official mac build upstream
  # (datasets/fairyStockfish.ts still resolves an imported copy first).
  extraResources:
    - from: "resources/engine/mac/fairy-stockfish"
      to: "engine/mac/fairy-stockfish"
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  icon: build/icon.icns
  category: public.app-category.board-games
  # Local/unsigned build: spawning the imported Stockfish binary requires the
  # hardened runtime OFF (or an allow-jit entitlement). Distribution to other
  # Macs needs a Developer ID identity + notarization. Set identity then.
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  # Fallback for the mac zip target (dmg has its own block below).
  artifactName: nodechess-${version}-${os}-${arch}.${ext}
linux:
  # x64 only, for the same reason as Windows: it is the arch the published
  # Stockfish artifacts target, and an arm64 Linux build would offer an engine
  # import that does not exist. Two artifacts: AppImage (runs anywhere, no
  # install, no root) and .deb (Debian/Ubuntu/Mint, the majority desktop).
  # No .rpm and no snap/flatpak: each is another packaging toolchain to keep
  # green, and the AppImage already covers every distro the deb does not.
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  # build/icon.png (the same source the .icns and .ico derive from).
  icon: build/icon.png
  category: Game
  # REQUIRED BY THE DEB TARGET, not optional politeness: fpm refuses to build a
  # .deb without a maintainer, and `author` in package.json is a bare name with
  # no address, so the first 1.4.0 run failed here after the AppImage had
  # already succeeded. Debian wants the RFC-822 `Name <email>` shape.
  # admin@nodechess.com is not receiving mail yet.
  maintainer: Isaac Miller <admin@nodechess.com>
  # Window association. Without a .desktop filename that matches Electron's
  # app_id, GNOME and KDE show a running nodechess window as a generic
  # unbranded entry instead of linking it to its launcher icon. syncDesktopName
  # derives the .desktop name from executableName when package.json declares no
  # desktopName, which is why executableName is pinned rather than left to
  # default off productName.
  executableName: nodechess
  syncDesktopName: true
  synopsis: Offline-first board-game studio
  description: >-
    Chess with Stockfish analysis, a 40-chapter school, ~4.7M Lichess puzzles,
    peer-to-peer online play, and 20+ board games including xiangqi, shogi, go,
    checkers and othello.
  # CAREFUL: ${arch} is NOT literal here. electron-builder rewrites it into each
  # packaging format's own arch spelling, so this one template yields
  # nodechess-<v>-linux-x86_64.AppImage and nodechess-<v>-linux-amd64.deb, not
  # the "x64" written on the mac and win artifacts. The landing page has to spell
  # those two out exactly; check release assets before editing this line.
  artifactName: nodechess-${version}-${os}-${arch}.${ext}
dmg:
  artifactName: nodechess-${version}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  # Names are spelled out rather than left to electron-builder's default because
  # updateLogic.pickWinAsset matches the installer by this exact prefix.
  artifactName: nodechess-Setup-${version}.${ext}
portable:
  artifactName: nodechess-Portable-${version}.${ext}
