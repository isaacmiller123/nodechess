<!DOCTYPE html>
<html lang="en" data-style="04" data-palette="marquee">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Games / nodechess</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="feel.css">
</head>
<body>
<div class="cab">
  <header class="marquee">
    <span class="wordmark">node<em>chess</em></span>
    <span class="marquee-spacer"></span>
    <div class="livery">
      <span class="livery-label" id="liv">Livery</span>
      <div class="keyrow" role="group" aria-labelledby="liv"><button class="key key--slim livery-key" type="button" data-pal="marquee" aria-pressed="true">Marquee</button><button class="key key--slim livery-key" type="button" data-pal="cobalt" aria-pressed="false">Cobalt</button><button class="key key--slim livery-key" type="button" data-pal="crimson" aria-pressed="false">Crimson</button><button class="key key--slim livery-key" type="button" data-pal="lagoon" aria-pressed="false">Lagoon</button></div>
    </div>
    <div class="pod">
      <span class="handle">mercer#K4T9P</span>
      <span class="readout" title="Rating">
        <span class="readout-value">1200</span>
        <span class="readout-flag">prov</span>
      </span>
    </div>
  </header>
  <main class="stage">
    <div class="stage-head">
      <h1 class="stage-title">Games</h1>
      <span class="stage-count">22 boards</span>
    </div>
    <div class="filters" role="group" aria-label="Filter games"><button class="key key--slim key--on" type="button">All 22</button><button class="key key--slim" type="button">Chess 9</button><button class="key key--slim" type="button">Regional 4</button><button class="key key--slim" type="button">Draughts 2</button><button class="key key--slim" type="button">Territory 3</button><button class="key key--slim" type="button">Classics 4</button></div>
      <section class="family">
        <div class="family-head">
          <h2 class="family-name">Chess and variants</h2>
          <span class="family-rule"></span>
          <span class="family-n">9</span>
        </div>
        <div class="rack">
        <button class="mini" type="button" data-cap="a">
          <span class="mini-marquee">Chess</span>
          <span class="mini-screen"><span class="mini-glyph">♞</span></span>
          <span class="mini-foot"><span class="mini-mode">Local</span><span class="mini-mode">Bot</span><span class="mini-mode">Online</span></span>
        </button>
        <button class="mini" type="button" data-cap="a">
          <span class="mini-marquee">Chess960</span>
          <span class="mini-screen"><span class="mini-glyph">♜</span></span>
          <span class="mini-foot"><span class="mini-mode">Local</span><span class="mini-mode">Bot</span><span class="mini-mode">Online</span></span>
        </button>
        <button class="mini" type="button" data-cap="a">
          <span class="mini-marquee">Crazyhouse</span>
          <span class="mini-screen"><span class="mini-glyph">♝</span></span>
          <span class="mini-foot"><span class="mini-mode">Local</span><span class="mini-mode">Bot</span><span class="mini-mode">Online</span></span>
        </button>
        <button class="mini" type="button" data-cap="a">
          <span class="mini-marquee">Atomic</span>
          <span class="mini-screen"><span class="mini-glyph">♛</span></span>
          <span class="mini-foot"><span class="mini-mode">Local</span><span class="mini-mode">Bot</span><span class="mini-mode">Online</span></span>
        </button>
        <button class="mini" type="button" data-cap="a">
          <span class="mini-marquee">Antichess</span>
          <span class="mini-screen"><span class="mini-glyph">♟</span></span>
          <span class="mini-foot"><span class="mini-mode">Local</span><span class="mini-mode">Bot</span><span class="mini-mode">Online</span></span>
        </button>
        <button class="mini" type="button" data-cap="a">
          <span class="mini-marquee">King of the Hill</span>
          <span class="mini-screen"><span class="mini-glyph">♚</span></span>
          <span class="mini-foot"><span class="mini-mode">Local</span><span class="mini-mode">Bot</span><span class="mini-mode">Online</span></span>
        </button>
        <button class="mini" type="button" data-cap="a">
          <span class="mini-marquee">Three-Check</span>
          <span class="mini-screen"><span class="mini-glyph">+++</span></span>
          <span class="mini-foot"><span class="mini-mode">Local</span><span class="mini-mode">Bot</span><span class="mini-mode">Online</span></span>
        </button>
        <button class="mini" type="button" data-cap="a">
          <span class="mini-marquee">Horde</span>
          <span class="mini-screen"><span class="mini-glyph">♟♟♟</span></span>
          <span class="mini-foot"><span class="mini-mode">Local</span><span class="mini-mode">Bot</span><span class="mini-mode">Online</span></span>
        </button>
        <button class="mini" type="button" data-cap="a">
          <span class="mini-marquee">Racing Kings</span>
          <span class="mini-screen"><span class="mini-glyph">♚♚</span></span>
          <span class="mini-foot"><span class="mini-mode">Local</span><span class="mini-mode">Bot</span><span class="mini-mode">Online</span></span>
        </button>
        </div>
      </section>
      <section class="family">
        <div class="family-head">
          <h2 class="family-name">Regional chess</h2>
          <span class="family-rule"></span>
          <span class="family-n">4</span>
        </div>
        <div class="rack">
        <button class="mini" type="button" data-cap="b">
          <span class="mini-marquee">Xiangqi</span>
          <span class="mini-screen"><span class="mini-glyph">將</span></span>
          <span class="mini-foot"><span class="mini-mode">Local</span><span class="mini-mode">Bot</span><span class="mini-mode">Online</span></span>
        </button>
        <button class="mini" type="button" data-cap="b">
          <span class="mini-marquee">Shogi</span>
          <span class="mini-screen"><span class="mini-glyph">王</span></span>
          <span class="mini-foot"><span class="mini-mode">Local</span><span class="mini-mode">Bot</span><span class="mini-mode">Online</span></span>
        </button>
        <button class="mini" type="button" data-cap="b">
          <span class="mini-marquee">Janggi</span>
          <span class="mini-screen"><span class="mini-glyph">楚</span></span>
          <span class="mini-foot"><span class="mini-mode">Local</span><span class="mini-mode">Bot</span><span class="mini-mode">Online</span></span>
        </button>
        <button class="mini" type="button" data-cap="b">
          <span class="mini-marquee">Makruk</span>
          <span class="mini-screen"><span class="mini-glyph">♝</span></span>
          <span class="mini-foot"><span class="mini-mode">Local</span><span class="mini-mode">Bot</span><span class="mini-mode">Online</span></span>
        </button>
        </div>
      </section>
      <section class="family">
        <div class="family-head">
          <h2 class="family-name">Draughts</h2>
          <span class="family-rule"></span>
          <span class="family-n">2</span>
        </div>
        <div class="rack">
        <button class="mini" type="button" data-cap="c">
          <span class="mini-marquee">Checkers</span>
          <span class="mini-screen"><span class="mini-glyph">●</span></span>
          <span class="mini-foot"><span class="mini-mode">Local</span><span class="mini-mode">Bot</span><span class="mini-mode">Online</span></span>
        </button>
        <button class="mini" type="button" data-cap="c">
          <span class="mini-marquee">International</span>
          <span class="mini-screen"><span class="mini-glyph">◍</span></span>
          <span class="mini-foot"><span class="mini-mode">Local</span><span class="mini-mode">Bot</span><span class="mini-mode">Online</span></span>
        </button>
        </div>
      </section>
      <section class="family">
        <div class="family-head">
          <h2 class="family-name">Territory</h2>
          <span class="family-rule"></span>
          <span class="family-n">3</span>
        </div>
        <div class="rack">
        <button class="mini" type="button" data-cap="d">
          <span class="mini-marquee">Go</span>
          <span class="mini-screen"><span class="mini-glyph">◉</span></span>
          <span class="mini-foot"><span class="mini-mode">Local</span><span class="mini-mode">Bot</span><span class="mini-mode">Online</span></span>
        </button>
        <button class="mini" type="button" data-cap="d">
          <span class="mini-marquee">Gomoku</span>
          <span class="mini-screen"><span class="mini-glyph">◈</span></span>
          <span class="mini-foot"><span class="mini-mode">Local</span><span class="mini-mode">Bot</span><span class="mini-mode">Online</span></span>
        </button>
        <button class="mini" type="button" data-cap="d">
          <span class="mini-marquee">Hex</span>
          <span class="mini-screen"><span class="mini-glyph">⬢</span></span>
          <span class="mini-foot"><span class="mini-mode">Local</span><span class="mini-mode">Bot</span><span class="mini-mode">Online</span></span>
        </button>
        </div>
      </section>
      <section class="family">
        <div class="family-head">
          <h2 class="family-name">Classics</h2>
          <span class="family-rule"></span>
          <span class="family-n">4</span>
        </div>
        <div class="rack">
        <button class="mini" type="button" data-cap="e">
          <span class="mini-marquee">Othello</span>
          <span class="mini-screen"><span class="mini-glyph">◐</span></span>
          <span class="mini-foot"><span class="mini-mode">Local</span><span class="mini-mode">Bot</span><span class="mini-mode">Online</span></span>
        </button>
        <button class="mini" type="button" data-cap="e">
          <span class="mini-marquee">Connect Four</span>
          <span class="mini-screen"><span class="mini-glyph">⬤</span></span>
          <span class="mini-foot"><span class="mini-mode">Local</span><span class="mini-mode">Bot</span><span class="mini-mode">Online</span></span>
        </button>
        <button class="mini" type="button" data-cap="e">
          <span class="mini-marquee">Nine Men's Morris</span>
          <span class="mini-screen"><span class="mini-glyph">▩</span></span>
          <span class="mini-foot"><span class="mini-mode">Local</span><span class="mini-mode">Bot</span><span class="mini-mode">Online</span></span>
        </button>
        <button class="mini" type="button" data-cap="e">
          <span class="mini-marquee">Tic-Tac-Toe</span>
          <span class="mini-screen"><span class="mini-glyph">✕</span></span>
          <span class="mini-foot"><span class="mini-mode">Local</span><span class="mini-mode">Bot</span><span class="mini-mode">Online</span></span>
        </button>
        </div>
      </section>
  </main>
  <nav class="panel" aria-label="Main">
    <div class="panel-row">
      <a class="pkey" data-cap="a" href="#">
        <span class="pkey-cap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="6 3 20 12 6 21" fill="currentColor" stroke="none"/></svg></span>
        <span class="pkey-legend">PLAY</span>
      </a>
      <a class="pkey" data-cap="b" href="games.html" aria-current="page">
        <span class="pkey-cap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg></span>
        <span class="pkey-legend">GAMES</span>
      </a>
      <a class="pkey" data-cap="c" href="#">
        <span class="pkey-cap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/></svg></span>
        <span class="pkey-legend">PUZZLES</span>
      </a>
      <a class="pkey" data-cap="d" href="school.html">
        <span class="pkey-cap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7v13"/><path d="M3 18V5a1 1 0 0 1 1-1h5a3 3 0 0 1 3 3 3 3 0 0 1 3-3h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-5.5a2.5 2.5 0 0 0-2.5 2.5 2.5 2.5 0 0 0-2.5-2.5H4a1 1 0 0 1-1-1Z"/></svg></span>
        <span class="pkey-legend">SCHOOL</span>
      </a>
      <a class="pkey" data-cap="e" href="#">
        <span class="pkey-cap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg></span>
        <span class="pkey-legend">REVIEW</span>
      </a>
      <a class="pkey" data-cap="f" href="#">
        <span class="pkey-cap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
        <span class="pkey-legend">PLAYER</span>
      </a>
    </div>
  </nav>
</div>
  <script>
    // The livery is the cabinet's paint. Same mechanism the app already uses.
    var root = document.documentElement;
    document.querySelectorAll('[data-pal]').forEach(function (b) {
      b.addEventListener('click', function () {
        root.dataset.palette = b.dataset.pal;
        document.querySelectorAll('[data-pal]').forEach(function (o) {
          o.setAttribute('aria-pressed', String(o === b));
          o.classList.toggle('key--on', o === b);
        });
      });
    });
  </script>
</body>
</html>
